[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "glioma-scenarios"
version = "0.1.0"
description = "MRI-anchored, identifiability-aware glioma treatment-scenario framework (research code)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9", "torch>=2.0", "nibabel>=4.0"]

[project.optional-dependencies]
download = ["idc-index>=0.5"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["glioma_scenarios*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
